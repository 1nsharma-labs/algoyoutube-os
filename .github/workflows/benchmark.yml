name: System Performance & Latency Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Benchmark Suite
        run: |
          node -e "
            import('./engines/benchmark/src/index.mjs').then(async b => {
              const res = await b.benchmarkEngine.runSuite();
              console.log('Benchmark Results:', res);
            });
          "
